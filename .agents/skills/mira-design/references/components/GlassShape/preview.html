<!-- @dsCard group="Atmosphere" height=300 subtitle="Frosted shapes on a cobalt field" -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&family=Pixelify+Sans:wght@400..700&display=swap">
<style>
  body { margin: 0; padding: 24px; background: var(--surface-0); color: var(--ink); font: 400 15px/1.5 var(--font-text); }
  .field { display: flex; flex-wrap: wrap; align-items: center; gap: 32px; padding: 40px; background: var(--cobalt); border-radius: var(--radius-xl); }
  .glow { box-shadow: var(--glow-cobalt); border-radius: 50%; display: inline-flex; }
</style>
<div id="root"></div>
<script>
  var M = window.Mira;
  var shapes = [['disc', 72], ['ring', 128], ['plus', 96], ['tile', 112], ['steps', 120], ['ring', 72], ['disc', 56]];
  document.getElementById('root').innerHTML =
    '<div class="field">' + shapes.map(function (s, i) {
      var el = M.GlassShape({ shape: s[0], size: s[1] });
      return i === 0 ? '<span class="glow">' + el + '</span>' : el;
    }).join('') + '</div>';
</script>
