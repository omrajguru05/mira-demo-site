<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&family=Pixelify+Sans:wght@400..700&display=swap">
<style>
  body { margin: 0; padding: 24px; background: var(--surface-0); color: var(--ink); font: 400 15px/1.5 var(--font-text); }
  .row { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 20px; margin-bottom: 20px; }
</style>
<div id="root"></div>
<script>
  var M = window.Mira;
  document.getElementById('root').innerHTML =
    '<div class="row">' + ['dark', 'light', 'ember', 'cobalt', 'glyph'].map(function (t) { return M.PixelMark({ size: 88, tone: t }); }).join('') + '</div>' +
    '<div class="row">' + [24, 32, 48, 64].map(function (s) { return M.PixelMark({ size: s, tone: 'dark' }); }).join('') + '</div>';
</script>
